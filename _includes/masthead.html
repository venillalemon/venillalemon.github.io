{% include base_path %}

<header class="site-head">
  <div class="col site-head__bar">
    <a class="brand" href="{{ base_path }}/">{{ site.title }}</a>
    <nav class="site-nav">
      <a href="{{ base_path }}/"{% if page.url == "/" %} class="is-active"{% endif %}>About</a>
      {% for link in site.data.navigation.main %}
        {% if link.url contains 'http' %}
          {% assign domain = '' %}
        {% else %}
          {% assign domain = base_path %}
        {% endif %}
        <a href="{{ domain }}{{ link.url }}"{% if page.url == link.url %} class="is-active"{% endif %}>{{ link.title }}</a>
      {% endfor %}
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Toggle light / dark theme">◐ theme</button>
    </nav>
  </div>
</header>
