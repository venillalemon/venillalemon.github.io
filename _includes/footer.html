{% include base_path %}

<div class="site-foot__links">
  {% if site.author.github %}<a href="https://github.com/{{ site.author.github }}">GitHub</a>{% endif %}
  {% if site.author.email %}<a href="mailto:{{ site.author.email }}">Email</a>{% endif %}
  {% if site.atom_feed.hide != true %}<a href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}">Feed</a>{% endif %}
  <a href="{{ base_path }}/blog/">Blog</a>
  <a href="{{ base_path }}/sitemap/">Sitemap</a>
</div>

<div>&copy; {{ site.time | date: '%Y' }} {{ site.name | default: site.title }} &middot; built with <a href="http://jekyllrb.com" rel="nofollow">Jekyll</a></div>
